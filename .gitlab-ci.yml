# =============================================================================
# umaa-cpp CI
#
# Produces two artifacts on the default branch and on tags:
#   1. SDK image -> GitLab Container Registry ($CI_REGISTRY_IMAGE)
#      = the umaa-cyclone-cpp dev container + the SDK installed at /opt/umaa-cpp
#   2. SDK package tar -> GitLab Generic Package Registry
#      (libumaa-cpp + headers + cmake config + runtime config) -- assembled
#      from the image contents, so the published package is identical to what
#      the SDK image ships. The package depends on the umaa-cyclone-cpp
#      package (UMAA types + CycloneDDS) being installed alongside it.
#
# Pipeline: test -> image -> package -> integration -> publish
#   * test        full build + ctest (unit + loopback DDS) in the DEV image;
#                 gates the image build so broken SDKs are never pushed
#   * image       builds/pushes the SDK image (Kaniko, rootless)
#   * package     builds ci/smoke inside the SDK image with zero setup (the
#                 property under test), then tars /opt/umaa-cpp
#   * integration untars the package into a fresh prefix in the plain DEV
#                 image and rebuilds+reruns the smoke test against it
#   * publish     uploads the tar to the generic package registry
#
# While the dev-container branch is unmerged, override BASE_IMAGE_TAG with a
# ref-slug or short-sha tag of the umaa-cyclone-cpp image (Run pipeline UI or
# `git push -o ci.variable="BASE_IMAGE_TAG=<tag>"`).
#
# Cross-project auth: pulling ${DEV_IMAGE} with the job token requires this
# project to be on the umaa-cyclone-cpp project's CI/CD job-token allowlist.
# =============================================================================

stages:
  - test
  - image
  - package
  - integration
  - publish

variables:
  PACKAGE_NAME: "umaa-cpp"
  DEV_IMAGE: "${CI_REGISTRY}/poseidon/utility/development-containers/umaa-cyclone-cpp"
  BASE_IMAGE_TAG: "latest"
  GIT_SUBMODULE_STRATEGY: none

# Run one pipeline per branch push and per tag (no duplicate MR pipelines).
workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

# -----------------------------------------------------------------------------
# 1) Full build + test in the dev image (gates everything downstream)
# -----------------------------------------------------------------------------
build-test:
  stage: test
  image: "${DEV_IMAGE}:${BASE_IMAGE_TAG}"
  script: |
    set -e
    cmake --preset ci
    cmake --build --preset ci
    mkdir -p reports
    ctest --preset ci --output-junit "${CI_PROJECT_DIR}/reports/ctest-junit.xml"
  artifacts:
    when: always
    reports:
      junit: reports/ctest-junit.xml
    expire_in: 1 week

# -----------------------------------------------------------------------------
# 2) Build & push the SDK image with Kaniko
# -----------------------------------------------------------------------------
# Kaniko is pinned to its final release (project archived; :debug is a moving
# tag). Every ref also gets a stable :<ref-slug> tag so feature-branch images
# are easy to point a devcontainer at while testing. The kaniko auth entry for
# ${CI_REGISTRY} covers both the cross-project base-image pull and the push.
build-image:
  stage: image
  needs: ["build-test"]
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script: |
    set -e
    mkdir -p /kaniko/.docker
    AUTH="$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')"
    printf '{"auths":{"%s":{"auth":"%s"}}}' "${CI_REGISTRY}" "${AUTH}" > /kaniko/.docker/config.json
    /kaniko/executor \
      --context "${CI_PROJECT_DIR}" \
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
      --build-arg "BASE_IMAGE=${DEV_IMAGE}:${BASE_IMAGE_TAG}" \
      --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}" \
      --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}" \
      ${EXTRA_DESTINATIONS} \
      --cache=true \
      --cache-repo "${CI_REGISTRY_IMAGE}/cache"
  rules:
    - if: '$CI_COMMIT_TAG'
      variables:
        EXTRA_DESTINATIONS: "--destination ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG} --destination ${CI_REGISTRY_IMAGE}:latest"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        EXTRA_DESTINATIONS: "--destination ${CI_REGISTRY_IMAGE}:latest"
    - if: '$CI_COMMIT_BRANCH'      # feature branches: validate build, sha tag only

# -----------------------------------------------------------------------------
# 3) Consume the image's preinstalled SDK, smoke test, assemble the tar
# -----------------------------------------------------------------------------
package:
  stage: package
  image: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
  needs: ["build-image"]
  variables:
    CYCLONEDDS_URI: "file://${CI_PROJECT_DIR}/config/cyclonedds-loopback.xml"
  script: |
    set -e
    # Build the smoke consumer against the image's /opt/umaa-cpp exactly like
    # a sibling project would: find_package with zero setup (no -G / no
    # -DCMAKE_PREFIX_PATH -- generator and prefix path come from image ENV,
    # which is precisely the property under test).
    cmake -S ci/smoke -B build-smoke -DCMAKE_BUILD_TYPE=Release
    cmake --build build-smoke
    ./build-smoke/umaa-cpp-smoke
    # Assemble the tar from the image contents (published tar == image).
    mkdir -p dist
    tar -czf "dist/umaa-cpp.tar.gz" -C /opt/umaa-cpp .
    echo "packaged $(du -h dist/umaa-cpp.tar.gz | cut -f1) tarball"
  artifacts:
    name: "umaa-cpp-${CI_COMMIT_SHORT_SHA}"
    paths:
      - dist/umaa-cpp.tar.gz
    expire_in: 1 week

# -----------------------------------------------------------------------------
# 4) Consume the package standalone in a fresh prefix (integration test)
# -----------------------------------------------------------------------------
# Runs in the plain DEV image (no /opt/umaa-cpp) to prove the tarball is
# consumable on its own next to the umaa-cyclone-cpp prefixes.
integration:
  stage: integration
  image: "${DEV_IMAGE}:${BASE_IMAGE_TAG}"
  needs: ["package"]
  variables:
    CYCLONEDDS_URI: "file://${CI_PROJECT_DIR}/config/cyclonedds-loopback.xml"
  script: |
    set -e
    PREFIX="${CI_PROJECT_DIR}/umaa-cpp-pkg"
    mkdir -p "${PREFIX}"
    tar -xzf dist/umaa-cpp.tar.gz -C "${PREFIX}"
    export CMAKE_PREFIX_PATH="${PREFIX}:${CMAKE_PREFIX_PATH}"
    export LD_LIBRARY_PATH="${PREFIX}/lib:${PREFIX}/lib64"
    cmake -S ci/smoke -B build-int -DCMAKE_BUILD_TYPE=Release
    cmake --build build-int
    ./build-int/umaa-cpp-smoke

# -----------------------------------------------------------------------------
# 5) Publish the tar to the Generic Package Registry (default branch + tags)
# -----------------------------------------------------------------------------
publish:
  stage: publish
  image: "${DEV_IMAGE}:${BASE_IMAGE_TAG}"
  needs: ["package", "integration"]
  script: |
    set -e
    PACKAGE_VERSION="${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
    TARGET="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${PACKAGE_VERSION}/umaa-cpp-${PACKAGE_VERSION}.tar.gz"
    echo "uploading to ${TARGET}"
    curl --fail --silent --show-error --location \
      --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
      --upload-file dist/umaa-cpp.tar.gz \
      "${TARGET}"
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
